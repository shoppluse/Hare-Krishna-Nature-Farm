<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Details | Botanical Database</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #07180d;
      --bg-2: #0d2414;
      --surface: rgba(255, 255, 255, 0.06);
      --text: #f5f7f2;
      --text-soft: #d0dacb;
      --muted: #9fb09c;
      --accent: #c9ef47;
      --border: rgba(255, 255, 255, 0.12);
      --radius-md: 22px;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(180deg, #07180d 0%, #0a1f11 40%, #0d2414 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px min(4%, 40px);
    }

    .container {
      width: min(92%, 1200px);
      margin: 0 auto;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 15px;
    }

    .btn-back {
      text-decoration: none;
      color: var(--accent);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .btn-download {
      background: var(--accent);
      color: #122006;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-download:hover { transform: translateY(-2px); }
    .btn-download:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

    /* Target wrapper that gets captured as an image */
    .capture-area {
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(180deg, #07180d 0%, #0a1f11 100%);
    }

    .profile-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    @media (max-width: 900px) {
      .profile-layout { grid-template-columns: 1fr; }
    }

    .plant-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(201, 239, 71, 0.12);
      color: var(--accent);
      border: 1px solid rgba(201, 239, 71, 0.2);
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 16px;
      font-family: var(--font-display);
    }

    .profile-info h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .desc-text {
      color: var(--text-soft);
      line-height: 1.8;
      font-size: 1rem;
    }

    /* ===== GALLERY LAYOUT SYSTEM ===== */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .main-image-viewport {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      background: rgba(0,0,0,0.2);
    }

    .main-image-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .thumbnails-ribbon {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .thumbnails-ribbon::-webkit-scrollbar {
      height: 4px;
    }
    .thumbnails-ribbon::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    .thumb-item {
      width: 80px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.6;
      transition: all 0.2s ease;
    }

    .thumb-item:hover, .thumb-item.active {
      opacity: 1;
      border-color: var(--accent);
      transform: scale(1.03);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .taxonomy-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }
    @media (max-width: 600px) {
       .taxonomy-grid { grid-template-columns: 1fr; }
    }

    .tax-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
    }

    .tax-card h4 {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .tax-card p {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .significance-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 30px;
      margin-top: 30px;
    }

    .significance-card h3 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      margin-bottom: 14px;
      color: var(--accent);
    }

    .significance-card p {
      color: var(--text-soft);
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="action-row">
      <a href="index.html#plants" class="btn-back">← Back to Plant Collection</a>
      <button class="btn-download" id="downloadImageButton">Download Medical Data Image</button>
    </div>

    <div id="loadingMessage" style="text-align: center; padding: 40px; color: var(--muted);">Resolving data mapping matrix...</div>
    
    <div id="profileWrapper" class="capture-area" style="display:none;">
      <div class="profile-layout">
        <div class="profile-info">
          <div class="plant-badge" id="viewNumber">Plant #—</div>
          <h1 id="viewName">—</h1>
          <div class="tagline" id="viewTagline">—</div>
          <p class="desc-text" id="viewDescription">—</p>
        </div>
        
        <div class="gallery-container">
          <div class="main-image-viewport">
            <img id="viewMainImg" src="" alt="Main Image Preview" crossorigin="anonymous">
          </div>
          <div class="thumbnails-ribbon" id="thumbnailsRibbon"></div>
        </div>
      </div>

      <div class="taxonomy-grid">
        <div class="tax-card">
          <h4>Botanical Name of Tree Specie</h4>
          <p id="viewBotanical" style="font-style: italic;">—</p>
        </div>
        <div class="tax-card">
          <h4>Vernacular Name of Tree Specie</h4>
          <p id="viewVernacular">—</p>
        </div>
        <div class="tax-card">
          <h4>Centre of Origin of Tree Specie</h4>
          <p id="viewOrigin">—</p>
        </div>
      </div>

      <div class="significance-card">
        <h3>Ayurvedic / Medical Significance</h3>
        <p id="viewMedical">—</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const activeId = urlParams.get("id") || "1";

      try {
        const response = await fetch('products.json');
        const database = await response.json();
        const plant = database.find(item => String(item.id) === String(activeId));

        if (!plant) {
          document.getElementById('loadingMessage').innerHTML = `<p style="color:red; font-weight:bold;">Profile target not found.</p>`;
          return;
        }

        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('profileWrapper').style.display = 'block';

        // Load content fields into browser elements
        document.getElementById('viewNumber').textContent = `Plant #${plant.number}`;
        document.getElementById('viewName').textContent = plant.name;
        document.getElementById('viewTagline').textContent = plant.tagline;
        document.getElementById('viewDescription').textContent = plant.description;
        document.getElementById('viewBotanical').textContent = plant.botanical;
        document.getElementById('viewVernacular').textContent = plant.vernacular;
        document.getElementById('viewOrigin').textContent = plant.origin;
        document.getElementById('viewMedical').textContent = plant.medical;

        const mainImgView = document.getElementById('viewMainImg');
        const ribbonContainer = document.getElementById('thumbnailsRibbon');
        const imagesList = (plant.images && plant.images.length > 0) ? plant.images : [plant.image];
        
        mainImgView.src = imagesList[0];
        mainImgView.alt = plant.name;

        // Build gallery ribbon thumbnails
        imagesList.forEach((imgUrl, loopIndex) => {
          const thumbElement = document.createElement('div');
          thumbElement.className = `thumb-item ${loopIndex === 0 ? 'active' : ''}`;
          thumbElement.innerHTML = `<img src="${imgUrl}" alt="Gallery Thumbnail">`;
          
          thumbElement.addEventListener('click', () => {
            mainImgView.style.opacity = '0.3';
            setTimeout(() => {
              mainImgView.src = imgUrl;
              mainImgView.style.opacity = '1';
            }, 150);

            document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
            thumbElement.classList.add('active');
          });
          
          ribbonContainer.appendChild(thumbElement);
        });

        // HIGH-PRECISION IMAGE SNAPSHOT DOWNLOAD METHOD
        document.getElementById('downloadImageButton').addEventListener('click', function() {
          const btn = this;
          const targetArea = document.getElementById('profileWrapper');

          btn.disabled = true;
          btn.textContent = "Taking Profile Snapshot...";

          // Capture the exact visible dashboard content area as a high-quality graphic asset
          html2canvas(targetArea, {
            useCORS: true,
            scale: 2, // Double resolution for high-definition crystal clear text
            backgroundColor: "#07180d", // Match your sleek brand gradient base color
            logging: false
          }).then(canvas => {
            // Transform canvas buffer directly into a local browser download link stream
            const imageURL = canvas.toDataURL("image/jpeg", 0.95);
            const downloadLink = document.createElement("a");
            
            downloadLink.href = imageURL;
            downloadLink.download = `${plant.name.replace(/\s+/g, '_')}_Profile_Data.jpg`;
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            btn.disabled = false;
            btn.textContent = "Download Medical Data Image";
          }).catch(err => {
            console.error("Snapshot pass broke down: ", err);
            btn.disabled = false;
            btn.textContent = "Download Failed - Try Again";
          });
        });

      } catch (err) {
        document.getElementById('loadingMessage').innerHTML = `<p style="color:red; font-weight:bold;">Failed to stream data channel matrices.</p>`;
      }
    });
  </script>
</body>
</html>
