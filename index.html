<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hare Krishna Nature Farm | Catalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #07180d;
      --bg-2: #0d2414;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-2: rgba(255, 255, 255, 0.1);
      --text: #f5f7f2;
      --text-2: #d0dacb;
      --muted: #9fb09c;
      --accent: #c9ef47;
      --accent-glow: rgba(201, 239, 71, 0.15);
      --border: rgba(255, 255, 255, 0.12);
      --shadow-md: 0 14px 36px rgba(0,0,0,0.3);
      --radius-md: 22px;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(180deg, #07180d 0%, #0a1f11 40%, #0d2414 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px var(--pad);
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ===== HEADER layout ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 40px;
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
    }
    .logo-text span { color: var(--accent); }

    .logo-sub {
      font-size: 0.75rem;
      color: var(--muted);
      font-style: italic;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 10px 20px;
      width: 100%;
      max-width: 400px;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      width: 100%;
      font-size: 0.9rem;
    }

    /* ===== PRODUCT GRID layout ===== */
    .section-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 24px;
      text-align: center;
    }
    .section-title span { color: var(--accent); }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .product-img-wrap {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
    }
    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-card:hover .product-img-wrap img { transform: scale(1.05); }

    .plant-number-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: #122006;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .product-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .product-category {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .botanical-name {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--muted);
    }

    .product-price {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-2);
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-area">
      <h1 class="logo-text">Nature<span>Farm</span></h1>
      <p class="logo-sub">Sacred Plant Profiles</p>
    </div>
    <div class="search-bar">
      <input type="search" id="searchInput" class="search-input" placeholder="Search by name or taxonomy..." />
    </div>
  </header>

  <main>
    <h2 class="section-title">Plants Grown with <span>Purpose & Devotion</span></h2>
    <div class="product-grid" id="productGrid">
      </div>
  </main>

  <script>
    let productsData = [];

    async function loadGrid() {
      try {
        const response = await fetch('products.json');
        productsData = await response.json();
        renderGrid(productsData);
      } catch (error) {
        document.getElementById('productGrid').innerHTML = `<p style="grid-column:1/-1; text-align:center; color:red;">Error processing database connection.</p>`;
      }
    }

    function renderGrid(list) {
      const container = document.getElementById('productGrid');
      container.innerHTML = "";
      
      if(list.length === 0) {
        container.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--muted);">No matching profiles found.</p>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement('a');
        card.className = 'product-card';
        card.href = `productdetail.html?id=${item.id}`;
        card.innerHTML = `
          <div class="product-img-wrap">
            <span class="plant-number-badge">#${item.number}</span>
            <img src="${item.image}" alt="${item.name}">
          </div>
          <div class="product-body">
            <div class="product-category">${item.category}</div>
            <div class="product-name">${item.name}</div>
            <div class="botanical-name">${item.botanical}</div>
            <div class="product-price">${item.price}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Dynamic filtering execution pass
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase().trim();
      const filtered = productsData.filter(p => 
        p.name.toLowerCase().includes(val) || 
        p.botanical.toLowerCase().includes(val) || 
        p.vernacular.toLowerCase().includes(val)
      );
      renderGrid(filtered);
    });

    document.addEventListener('DOMContentLoaded', loadGrid);
  </script>
</body>
</html>
