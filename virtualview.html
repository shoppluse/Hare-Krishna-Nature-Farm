<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual View Tour | ISKCON Farm House</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root {
      --bg-dark: #07180d;
      --bg-dark-2: #0d2414;
      --primary: #c9ef47;
      --primary-dark: #a8d62d;
      --text-light: #f5f7f2;
      --text-soft: #d0dacb;
      --border: rgba(255,255,255,0.12);
      --radius: 18px;
      --transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      height: 100vh;
      overflow: hidden;
    }

    .view-manager {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 1500px;
    }

    /* ===== OVERLAY MENU CONTROLS ===== */
    .tour-overlay-controls {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 100;
      display: flex;
      gap: 12px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(9, 25, 14, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-action:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }

    /* ===== STAGE 1: MAP PERSPECTIVE OVERVIEW ===== */
    .map-perspective-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      transform-style: preserve-3d;
      background: #040d07;
    }

    .map-canvas-base {
      position: relative;
      width: 100%;
      height: 100%;
      /* Pulls your uploaded satellite map directly with an organic color-grading layer */
      background: linear-gradient(rgba(7, 24, 13, 0.15), rgba(7, 24, 13, 0.3)), url('image_b1a321.jpg') center/cover no-repeat;
      transition: var(--transition);
      transform: scale(1.0);
    }

    /* Cinematic Zoom In Transition animation properties */
    .view-manager.zoomed-in .map-perspective-container {
      transform: translateZ(800px) scale(1.2);
      opacity: 0;
      pointer-events: none;
    }

    /* ===== GEOLOCATION PULSE HOTSPOTS ===== */
    .map-marker-pulse {
      position: absolute;
      width: 28px;
      height: 28px;
      background: var(--primary);
      border: 3px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      transform: translate(-50%, -50%);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .map-marker-pulse::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      opacity: 1;
      animation: pulseAnimation 2s infinite;
    }

    @keyframes pulseAnimation {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .map-marker-pulse:hover {
      transform: translate(-50%, -50%) scale(1.3);
      background: #fff;
      border-color: var(--primary);
    }

    /* Label Cards with Pop Design Layouts */
    .marker-label-card {
      position: absolute;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d2414;
      border: 1px solid var(--primary);
      padding: 6px 14px;
      border-radius: 8px;
      white-space: nowrap;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      box-shadow: var(--shadow);
      transition: all 0.3s;
    }
    .map-marker-pulse:hover .marker-label-card {
      background: var(--primary);
      color: #122006;
      bottom: 42px;
    }

    /* Coordinate Mappings aligned exactly over your map assets */
    #spot1 { top: 40%; left: 31%; } /* ISKCON Temple */
    #spot2 { top: 59%; left: 51%; } /* Akshaya Patra Foundation */
    #spot3 { top: 11%; left: 44%; } /* Kaveri River Front */
    #spot4 { top: 72%; left: 27%; } /* Organic Agriculture Nursery */
    #spot5 { top: 48%; left: 75%; } /* Sacred Goshala Dairy Sector */

    /* ===== STAGE 2: 360 DEGREE PANORAMIC LIVE WINDOW ===== */
    .panorama-viewport-wrapper {
      position: absolute;
      inset: 0;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.15);
      transition: var(--transition);
      background: #000;
    }

    .view-manager.zoomed-in .panorama-viewport-wrapper {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1.0);
    }

    /* Panoramic image viewport strip controller */
    .panoramic-render-strip {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      position: relative;
      transition: background-image 0.4s ease;
    }

    /* Left/Right manual panorama browsing handles */
    .pano-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 60;
      transition: all 0.3s;
    }
    .pano-arrow:hover { background: var(--primary); color: #122006; }
    .arrow-left { left: 20px; }
    .arrow-right { right: 20px; }

    /* HUD Information Panel Overlay Card */
    .hud-info-banner {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90%, 600px);
      background: rgba(7, 24, 13, 0.9);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: var(--radius);
      backdrop-filter: blur(15px);
      box-shadow: var(--shadow);
      text-align: center;
      z-index: 60;
    }

    .hud-info-banner h2 {
      font-family: 'Poppins', sans-serif;
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 1.4rem;
    }

    .hud-info-banner p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-soft);
    }

    .audio-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .audio-bar {
      width: 3px; height: 12px; background: var(--primary);
      animation: audioWave 1.2s ease-in-out infinite alternate;
    }
    .audio-bar:nth-child(2) { animation-delay: 0.2s; }
    .audio-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes audioWave {
      0% { height: 4px; }
      100% { height: 16px; }
    }
  </style>
</head>
<body>

  <div class="view-manager" id="viewManager">
    
    <div class="tour-overlay-controls">
      <a href="index.html" class="btn-action"><i class="fa-solid fa-arrow-left"></i> Back to Farm Home</a>
      <button class="btn-action" id="exitPanoBtn" style="display: none;"><i class="fa-solid fa-minimize"></i> Return to Map View</button>
    </div>

    <div class="map-perspective-container">
      <div class="map-canvas-base">
        
        <div class="map-marker-pulse" id="spot1" onclick="engageZoom('spot1')">
          <div class="marker-label-card">ISKCON Krishna Balaram Temple</div>
        </div>

        <div class="map-marker-pulse" id="spot2" onclick="engageZoom('spot2')">
          <div class="marker-label-card">The Akshaya Patra Foundation</div>
        </div>

        <div class="map-marker-pulse" id="spot3" onclick="engageZoom('spot3')">
          <div class="marker-label-card">Kaveri River Front</div>
        </div>

        <div class="map-marker-pulse" id="spot4" onclick="engageZoom('spot4')">
          <div class="marker-label-card">Organic Agriculture Nursery</div>
        </div>

        <div class="map-marker-pulse" id="spot5" onclick="engageZoom('spot5')">
          <div class="marker-label-card">Sacred Devotional Goshala</div>
        </div>

      </div>
    </div>

    <div class="panorama-viewport-wrapper" id="panoViewport">
      <button class="pano-arrow arrow-left" id="panoLeftBtn"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="pano-arrow arrow-right" id="panoRightBtn"><i class="fa-solid fa-chevron-right"></i></button>
      
      <div class="panoramic-render-strip" id="panoStrip"></div>
      
      <div class="hud-info-banner">
        <h2 id="hudTitle">Location Location</h2>
        <p id="hudDescription">Immersive descriptive parameters load dynamically here...</p>
        <div class="audio-indicator">
          <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
          <span>Playing Ambient Spiritual Atmosphere Chants</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Panoramic view data storage logic nodes containing multi-angle gallery variations
    const tourDatabase = {
      spot1: {
        title: "ISKCON Krishna Balaram Temple",
        description: "Experience the profound spiritual atmosphere of the central altar. Echoes of dynamic kirtan, Vedic mantras, and delicate aromas of incense fill the space, providing a serene refuge for complete meditation.",
        angles: [
          "https://images.unsplash.com/photo-1609137144813-7d84860b411d?auto=format&fit=crop&w=2400&q=80",
          "https://images.unsplash.com/photo-1545128485-c400e7702796?auto=format&fit=crop&w=2400&q=80"
        ]
      },
      spot2: {
        title: "The Akshaya Patra Foundation",
        description: "The massive, highly optimized humanitarian service kitchen processing sanctified organic crops harvested from our acres into fresh meals distributed daily to thousands of students.",
        angles: [
          "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=2400&q=80",
          "https://images.unsplash.com/photo-1547573854-74d2a71d0826?auto=format&fit=crop&w=2400&q=80"
        ]
      },
      spot3: {
        title: "Kaveri River Front Corridor",
        description: "The sacred water boundary tracing along our northern border, continuously carrying refreshing river breezes across the fields and supplying life to the topsoil layer structures.",
        angles: [
          "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=80",
          "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2400&q=80"
        ]
      },
      spot4: {
        title: "Organic Agriculture Nursery",
        description: "Our core cultivation site where zero-chemical bio-fertilizers nurture ancient grains, flowers, and medicinal tree species from seeds before field dispersion.",
        angles: [
          "https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=2400&q=80",
          "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=2400&q=80"
        ]
      },
      spot5: {
        title: "Sacred Devotional Goshala",
        description: "Our center for cow protection, caring for cattle in a peaceful environment that provides pure organic dairy products for temple deity worship.",
        angles: [
          "https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?auto=format&fit=crop&w=2400&q=80",
          "https://images.unsplash.com/photo-1596733430284-f7437764b1a9?auto=format&fit=crop&w=2400&q=80"
        ]
      }
    };

    let activeLocation = null;
    let activeAngleIndex = 0;

    const manager = document.getElementById("viewManager");
    const exitBtn = document.getElementById("exitPanoBtn");
    const panoStrip = document.getElementById("panoStrip");
    const hudTitle = document.getElementById("hudTitle");
    const hudDesc = document.getElementById("hudDescription");

    // Initiate Zoom Sequence into Panoramic Display Viewport
    function engageZoom(locationKey) {
      activeLocation = tourDatabase[locationKey];
      if(!activeLocation) return;

      activeAngleIndex = 0;
      updatePanoramicSceneView();

      manager.classList.add("zoomed-in");
      exitBtn.style.display = "inline-flex";
    }

    function updatePanoramicSceneView() {
      hudTitle.textContent = activeLocation.title;
      hudDesc.textContent = activeLocation.description;
      panoStrip.style.backgroundImage = `url('${activeLocation.angles[activeAngleIndex]}')`;
    }

    // Panoramic view angle shift routines
    document.getElementById("panoLeftBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      activeAngleIndex = (activeAngleIndex - 1 + activeLocation.angles.length) % activeLocation.angles.length;
      updatePanoramicSceneView();
    });

    document.getElementById("panoRightBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      activeAngleIndex = (activeAngleIndex + 1) % activeLocation.angles.length;
      updatePanoramicSceneView();
    });

    // Collapse View state back down to basic Top-Down overview grid parameters
    function reverseZoom() {
      manager.classList.remove("zoomed-in");
      exitBtn.style.display = "none";
    }

    exitBtn.addEventListener("click", reverseZoom);
  </script>
</body>
</html>
